[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dax"
dynamic = ["version"]
requires-python = ">=3.7"
# keyring holds every credential in the macOS Keychain, so the host needs it;
# the image (Linux) never reads Keychain directly, so it's left out there.
dependencies = ["pyyaml", "ruamel.yaml", "questionary", "keyring; sys_platform == 'darwin'"]

[project.optional-dependencies]
container = ["mcp", "python-docx", "lxml"]
test = ["pytest"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[project.scripts]
dax = "dax:main"
dax-creds = "dax_creds.cli:main"

[tool.setuptools]
py-modules = ["dax"]
packages = ["dax_creds", "dax_creds.providers", "dax_mcp"]
